<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 페이지를 찾을 수 없습니다 | SUYUGAME</title>
    <style>
        @font-face {
            font-family: 'Korail';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailL.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Korail';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailM.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Korail';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailB.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Korail', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f5f6fa;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 48px 36px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .logo-area img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 600;
            color: #4F46E5;
            letter-spacing: -0.5px;
        }

        /* 대문짝만하게 키운 404 스타일 */
        .error-code {
            font-size: 110px;
            font-weight: 600;
            color: #4F46E5;
            line-height: 1;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 20px;
            font-weight: 400;
            color: #64748b;
            margin-bottom: 36px;
        }

        .btn-home {
            display: block;
            width: 100%;
            background-color: #4F46E5;
            color: #ffffff;
            padding: 16px 0;
            border-radius: 14px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-home:hover {
            background-color: #4338ca;
        }

        .btn-home:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 로고 -->
        <a href="https://suyugame.kro.kr" class="logo-area">
            <img src="logo.png" alt="SUYUGAME 로고" onerror="this.src='https://suyugame.kro.kr/logo.png'">
            <span class="logo-text">SUYUGAME</span>
        </a>

        <!-- 대문짝만한 404 -->
        <div class="error-code">404</div>
        <p class="error-title">페이지를 찾을 수 없습니다</p>

        <!-- 맨 밑 홈 페이지로 돌아가기 -->
        <a href="https://suyugame.kro.kr" class="btn-home">홈 페이지로 돌아가기</a>
    </div>

</body>
</html>
