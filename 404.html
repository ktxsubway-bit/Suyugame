<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 | PAGE NOT FOUND</title>
    <style>
        /* Korail 폰트 정의 */
        @font-face {
            font-family: 'Korail';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailL.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'Korail';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailM.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'Korail';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2511-Korail@1.0/KorailB.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Korail', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f7f8fc;
            color: #2b2d42;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 32px rgba(91, 66, 243, 0.06);
            border: 1px solid #eef0f8;
        }

        /* 수유게임 로고 스타일 */
        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 800;
            color: #4f46e5;
            letter-spacing: -0.5px;
            margin-bottom: 28px;
            text-decoration: none;
        }

        .logo img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        /* 404 및 안내문구 */
        .error-badge {
            display: inline-block;
            background-color: #eef2ff;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 800;
            color: #1e1b4b;
            margin-bottom: 12px;
            word-break: keep-all;
        }

        .error-desc {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 32px;
            word-break: keep-all;
        }

        /* 맨 밑 홈 페이지로 돌아가기 버튼 */
        .btn-home {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: #4f46e5;
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .btn-home:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
        }

        .btn-home:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SUYUGAME 상단 로고 -->
        <a href="https://suyugame.kro.kr" class="logo">
            <img src="logo.png" alt="SUYUGAME 로고" onerror="this.src='https://suyugame.kro.kr/logo.png'">
            SUYUGAME
        </a>

        <!-- 404 안내 카드 -->
        <div>
            <span class="error-badge">404 ERROR</span>
            <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
            <p class="error-desc">
                요청하신 주소가 올바르지 않거나 변경되어<br>
                페이지를 표시할 수 없습니다.
            </p>
        </div>

        <!-- 하단 홈으로 돌아가기 버튼 -->
        <a href="https://suyugame.kro.kr" class="btn-home">
            <span>홈 페이지로 돌아가기</span>
        </a>
    </div>
</body>
</html>
