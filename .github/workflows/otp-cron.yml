name: 5분마다 OTP 자동 업데이트

on:
  workflow_dispatch:

jobs:
  update-otp:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 파이어베이스 Admin SDK 설치
        run: npm install firebase-admin

      - name: OTP 업데이트 스크립트 실행
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node otp.js
